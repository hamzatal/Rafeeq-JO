# Production stack for Rafeeq.
# Secrets MUST be provided via a real secrets manager / .env (never committed).
#   docker compose -f deployment/docker-compose.prod.yml up -d
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env.production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8080"
    healthcheck:
      # Deep readiness probe: only healthy when DB + cache are reachable.
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ../frontend
      dockerfile: admin-dashboard/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${ADMIN_API_URL:-https://api.rafeeq.jo}
    ports:
      - "3000:3000"

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rafeeq}
      POSTGRES_USER: ${DB_USERNAME:-rafeeq}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rafeeq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverb:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env.production
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      redis: { condition: service_healthy }
    ports:
      - "8080:8080"

  # Processes queued work: bulk notifications, AI receipt verification, push
  # fan-out, etc. Without this, anything dispatched to the queue never runs.
  queue:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env.production
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=3", "--timeout=600", "--sleep=3", "--max-jobs=1000", "--max-time=3600"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # `|| exit 0` was here, which made this healthcheck incapable of ever failing:
      # the worker could be dead and the container would still report healthy. A
      # healthcheck that cannot fail is worse than none, because it is believed.
      #
      # `queue:work --once` proves the worker can actually connect to Redis and reserve
      # a job, which is the thing that breaks. `queue:monitor` only reports depth.
      test: ["CMD-SHELL", "php artisan queue:monitor default --max=10000 && php artisan rafeeq:worker-alive"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Runs Laravel's scheduler (OTP pruning + hourly fraud sweep). One instance only.
  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env.production
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
    healthcheck:
      # The scheduler had NO healthcheck, so if it died the retention jobs, the
      # subscription expiry and the backups all stopped silently — and the first
      # symptom would be a table that had grown for a month.
      # The heartbeat file is touched by a scheduled task every minute.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/scheduler-heartbeat 2>/dev/null || echo 0) )) -lt 180"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  pgdata:
  redisdata:
