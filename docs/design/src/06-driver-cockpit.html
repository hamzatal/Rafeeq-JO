<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="_phone.css"></head><body>
<div class="scr" style="background:var(--n50)">
  <div class="status"><span>9:41</span><div class="r">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#0E1524"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
    <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x=".5" y=".5" width="20" height="11" rx="3" stroke="#0E1524" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#0E1524"/><path d="M22 4v4" stroke="#0E1524" stroke-width="2" stroke-linecap="round" opacity=".4"/></svg>
  </div></div>

  <div class="hd row" style="gap:12px">
    <div class="av" style="width:42px;height:42px;font-size:18px">م</div>
    <div class="col" style="gap:0">
      <span class="t-caption" style="color:var(--n500)">لوحة الكابتن</span>
      <span class="t-title-md">محمد العبداللات</span>
    </div>
    <div class="sp"></div>
    <span class="pill pill-ok"><span class="i i-ok"></span>معتمد</span>
  </div>

  <div class="body-pad">
    <!-- ONE giant online switch — full width, 64 tall. Not a tiny toggle in a card. -->
    <div style="background:var(--ok);border-radius:16px;height:64px;display:flex;align-items:center;
      padding:0 18px;gap:14px;margin-bottom:12px">
      <div style="width:52px;height:32px;border-radius:999px;background:rgba(255,255,255,.3);
        display:flex;align-items:center;padding:3px;justify-content:flex-end">
        <div style="width:26px;height:26px;border-radius:50%;background:#fff"></div></div>
      <div class="col" style="gap:1px">
        <span style="font:700 18px 'IBM Plex Sans Arabic';color:#fff">متصل — تستقبل الطلبات</span>
        <span style="font:400 12px 'IBM Plex Sans Arabic';color:rgba(255,255,255,.85)">اضغط لإيقاف استقبال الرحلات</span></div>
    </div>

    <!-- ONE hero number -->
    <div class="card" style="margin-bottom:12px">
      <div class="t-label" style="color:var(--n500)">أرباح اليوم</div>
      <div class="row" style="align-items:baseline;gap:6px;margin-top:1px">
        <span class="num" style="font:700 34px/40px 'IBM Plex Sans Arabic'">18.750</span>
        <span class="t-title-sm" style="color:var(--n600)">د.أ</span>
        <div class="sp"></div>
        <span class="pill pill-ok"><span class="i i-up"></span>12% عن أمس</span>
      </div>
      <div class="row" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--n100)">
        <div class="col" style="flex:1;gap:1px"><span class="t-caption" style="color:var(--n500)">رحلات اليوم</span><span class="t-title-sm num" style="font-weight:700">7</span></div>
        <div style="width:1px;height:30px;background:var(--n200)"></div>
        <div class="col" style="flex:1;gap:1px;padding-inline-start:14px"><span class="t-caption" style="color:var(--n500)">ساعات التشغيل</span><span class="t-title-sm num" style="font-weight:700">5.5</span></div>
        <div style="width:1px;height:30px;background:var(--n200)"></div>
        <div class="col" style="flex:1;gap:1px;padding-inline-start:14px"><span class="t-caption" style="color:var(--n500)">تقييمي</span>
          <div class="row" style="gap:4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="#F59E0B"><path d="M12 2l3 6.5 7 1-5 5 1.2 7L12 18l-6.2 3.5L7 14.5 2 9.5l7-1z"/></svg><span class="t-title-sm num" style="font-weight:700">4.9</span></div></div>
      </div>
    </div>

    <!-- live map -->
    <div style="height:186px;border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--n200);margin-bottom:12px">
      <div class="map" style="position:absolute;inset:0">
        <div class="grn" style="left:-14px;top:20px;width:96px;height:74px"></div>
        <div class="blk" style="left:44px;top:104px;width:66px;height:44px"></div>
        <div class="blk" style="right:50px;top:38px;width:74px;height:52px"></div>
        <div class="blk" style="right:36px;top:118px;width:56px;height:40px"></div>
        <div class="rd-m" style="left:0;top:94px;width:390px;height:9px"></div>
        <div class="rd-m" style="left:170px;top:0;width:9px;height:186px"></div>
        <div class="rd" style="left:0;top:34px;width:390px;height:5px"></div>
        <div class="disc" style="left:176px;top:99px;width:40px;height:40px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#0E1524"><path d="M5 11l1.5-4.5A2 2 0 018.4 5h7.2a2 2 0 011.9 1.5L19 11v6a1 1 0 01-1 1h-1a1 1 0 01-1-1v-1H8v1a1 1 0 01-1 1H6a1 1 0 01-1-1z"/></svg></div>
      </div>
      <div style="position:absolute;top:10px;inset-inline-start:10px;background:#fff;box-shadow:var(--sh-md);
        border-radius:999px;height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 11px">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></div>
        <span class="t-caption" style="font-weight:700;color:var(--n800)">موقعك مباشر · إربد</span></div>
    </div>

    <div class="card" style="padding:0">
      <div class="row" style="padding:14px 16px;border-bottom:1px solid var(--n100)">
        <div style="width:38px;height:38px;border-radius:12px;background:var(--b50);display:grid;place-items:center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1259E3" stroke-width="1.75" stroke-linecap="round"><path d="M5 17h14M7 17V9l2-4h6l2 4v8"/></svg></div>
        <span class="t-title-sm" style="font-weight:700">رحلاتي</span><div class="sp"></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#96A0B2" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></div>
      <div class="row" style="padding:14px 16px;border-bottom:1px solid var(--n100)">
        <div style="width:38px;height:38px;border-radius:12px;background:var(--b50);display:grid;place-items:center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1259E3" stroke-width="1.75" stroke-linecap="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20"/></svg></div>
        <span class="t-title-sm" style="font-weight:700">أرباحي والسحب</span><div class="sp"></div>
        <span class="t-label num" style="color:var(--n600)">142.500 د.أ</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#96A0B2" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></div>
      <div class="row" style="padding:14px 16px">
        <div style="width:38px;height:38px;border-radius:12px;background:var(--b50);display:grid;place-items:center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1259E3" stroke-width="1.75" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></div>
        <span class="t-title-sm" style="font-weight:700">مركبتي ووثائقي</span><div class="sp"></div>
        <span class="pill pill-ok"><span class="i i-ok"></span>مكتملة</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#96A0B2" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1259E3" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></div><span>الكوكبِت</span></div>
    <div class="tab"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#67728A" stroke-width="2" stroke-linecap="round"><path d="M5 17h14M7 17V9l2-4h6l2 4v8"/><circle cx="8.5" cy="17" r="1.5"/><circle cx="15.5" cy="17" r="1.5"/></svg></div><span>رحلاتي</span></div>
    <div class="tab"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#67728A" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div><span>أرباحي</span></div>
    <div class="tab"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#67728A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></div><span>حسابي</span></div>
  </div>
</div>
</body></html>
