<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="_phone.css"></head><body>
<div class="scr">
  <div class="map">
    <div class="grn" style="left:-20px;top:60px;width:120px;height:96px"></div>
    <div class="blk" style="left:40px;top:180px;width:80px;height:56px"></div>
    <div class="blk" style="right:44px;top:150px;width:84px;height:64px"></div>
    <div class="rd-m" style="left:0;top:246px;width:390px;height:11px"></div>
    <div class="rd-m" style="left:186px;top:40px;width:11px;height:300px"></div>
    <div class="rd" style="left:0;top:140px;width:390px;height:6px"></div>
    <svg style="position:absolute;inset:0" width="390" height="400">
      <path class="route-c" d="M112,300 L112,252 L192,252 L192,146 L276,146"/>
      <path class="route"   d="M112,300 L112,252 L192,252 L192,146 L276,146"/>
    </svg>
    <div class="pin" style="left:112px;top:300px"><svg width="28" height="38" viewBox="0 0 30 40"><path d="M15 1C7.3 1 1 7.3 1 15c0 10 14 24 14 24s14-14 14-24C29 7.3 22.7 1 15 1z" fill="#1259E3" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15" r="5.5" fill="#fff"/></svg></div>
    <div class="pin" style="left:276px;top:146px"><svg width="28" height="38" viewBox="0 0 30 40"><path d="M15 1C7.3 1 1 7.3 1 15c0 10 14 24 14 24s14-14 14-24C29 7.3 22.7 1 15 1z" fill="#047857" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15" r="5.5" fill="#fff"/></svg></div>
  </div>

  <div class="status"><span>9:41</span><div class="r">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#0E1524"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
    <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x=".5" y=".5" width="20" height="11" rx="3" stroke="#0E1524" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#0E1524"/><path d="M22 4v4" stroke="#0E1524" stroke-width="2" stroke-linecap="round" opacity=".4"/></svg>
  </div></div>

  <div class="topcap"><div class="fab" style="position:relative">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#39415A" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></div>
    <div class="sp"></div></div>

  <!-- Sheet at FULL snap: route + class + payment + coupon. Replaces the separate checkout screen. -->
  <div class="bs" style="height:610px">
    <div class="grab"></div>

    <!-- route summary -->
    <div class="card" style="padding:14px;margin-bottom:16px">
      <div class="row" style="gap:11px;align-items:flex-start">
        <div class="col" style="align-items:center;gap:0;padding-top:5px">
          <div style="width:9px;height:9px;border-radius:50%;background:var(--b600)"></div>
          <div style="width:2px;height:26px;background:var(--n300)"></div>
          <div style="width:9px;height:9px;border-radius:50%;background:var(--ok)"></div>
        </div>
        <div class="col" style="flex:1;gap:14px">
          <div class="col" style="gap:0"><span class="t-caption" style="color:var(--n500)">من</span><span class="t-title-sm" style="font-weight:700">حي الجامعة، شارع الملكة نور</span></div>
          <div class="col" style="gap:0"><span class="t-caption" style="color:var(--n500)">إلى</span><span class="t-title-sm" style="font-weight:700">جامعة اليرموك — البوابة الشمالية</span></div>
        </div>
        <span class="t-label" style="color:var(--b700);font-weight:700">تعديل</span>
      </div>
    </div>

    <div class="t-label" style="color:var(--n500);margin-bottom:9px">اختر الفئة</div>

    <!-- selected: blue-50 fill + blue-600 border. Unselected: plain card. -->
    <div style="background:var(--b50);border:1.5px solid var(--b600);border-radius:16px;padding:14px;margin-bottom:9px;display:flex;align-items:center;gap:13px">
      <div style="width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1259E3" stroke-width="1.6" stroke-linecap="round"><path d="M5 11l1.5-4.5A2 2 0 018.4 5h7.2a2 2 0 011.9 1.5L19 11v6a1 1 0 01-1 1h-1a1 1 0 01-1-1v-1H8v1a1 1 0 01-1 1H6a1 1 0 01-1-1z"/><circle cx="8" cy="14.5" r="1.3" fill="#1259E3"/><circle cx="16" cy="14.5" r="1.3" fill="#1259E3"/></svg></div>
      <div class="col" style="flex:1;gap:2px">
        <div class="row" style="gap:7px"><span class="t-title-sm" style="font-weight:700">اقتصادي</span><span class="pill pill-info">الأوفر</span></div>
        <span class="t-caption" style="color:var(--n600)">4 مقاعد · يصل خلال 4 دقائق</span></div>
      <div class="col" style="align-items:flex-start;gap:0">
        <span class="t-title-md num">1.250</span><span class="t-caption" style="color:var(--n500)">د.أ</span></div>
    </div>

    <div class="card" style="padding:14px;margin-bottom:9px;display:flex;align-items:center;gap:13px">
      <div style="width:46px;height:46px;border-radius:12px;background:var(--n100);display:grid;place-items:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4E5872" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="7" width="20" height="10" rx="2"/><circle cx="7" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/><path d="M6 7V5h12v2"/></svg></div>
      <div class="col" style="flex:1;gap:2px"><span class="t-title-sm" style="font-weight:700">عائلي</span>
        <span class="t-caption" style="color:var(--n600)">7 مقاعد · يصل خلال 8 دقائق</span></div>
      <div class="col" style="align-items:flex-start;gap:0">
        <span class="t-title-md num" style="color:var(--n700)">2.100</span><span class="t-caption" style="color:var(--n500)">د.أ</span></div>
    </div>

    <div class="card" style="padding:0;margin-bottom:16px">
      <div class="row" style="padding:14px 16px;border-bottom:1px solid var(--n100)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1259E3" stroke-width="1.75" stroke-linecap="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20"/></svg>
        <div class="col" style="gap:0"><span class="t-title-sm" style="font-weight:700">المحفظة</span>
          <span class="t-caption num" style="color:var(--ok)">الرصيد 12.500 د.أ — كافٍ</span></div>
        <div class="sp"></div>
        <div style="width:20px;height:20px;border-radius:50%;background:var(--b600);display:grid;place-items:center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      </div>
      <div class="row" style="padding:14px 16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E5872" stroke-width="1.75" stroke-linecap="round"><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2v-6"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg>
        <span class="t-title-sm" style="font-weight:700">أضف كوبون خصم</span><div class="sp"></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#96A0B2" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    </div>

    <div class="row" style="margin-bottom:12px">
      <span class="t-body" style="color:var(--n600)">الإجمالي</span><div class="sp"></div>
      <span class="t-title-lg num">1.250 <span class="t-title-sm" style="color:var(--n600)">د.أ</span></span>
    </div>
    <button class="btn btn-primary">اطلب الآن</button>
  </div>
</div>
</body></html>
