name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite runs against Postgres, not SQLite. SQLite silently ignores
    # SELECT ... FOR UPDATE, which made every lockForUpdate untestable and let
    # three concurrency bugs through a green suite.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rafeeq_test
          POSTGRES_USER: rafeeq
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pgsql, pdo_pgsql, sqlite3, pdo_sqlite, redis
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (php -l) all source files
        run: |
          find Core Shared Infrastructure Modules database config bootstrap -name "*.php" -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Static analysis (PHPStan / Larastan, level 5 + baseline)
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Boot smoke test (registers every module + route)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan route:list > /dev/null
          php artisan config:clear

      - name: Migrate against Postgres
        env: &pg
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rafeeq_test
          DB_USERNAME: rafeeq
          DB_PASSWORD: secret
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force

      - name: Run PHPUnit tests (Postgres + coverage)
        env: *pg
        run: php -d memory_limit=1G vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          php -r '
            $f = "coverage.xml";
            if (! is_file($f)) { echo "no coverage file\n"; exit(0); }
            $x = simplexml_load_file($f);
            $m = $x->project->metrics;
            $s = (int) $m["statements"]; $c = (int) $m["coveredstatements"];
            $pct = $s ? round($c / $s * 100, 2) : 0;
            printf("lines %d/%d = %s%%\n", $c, $s, $pct);
            file_put_contents(getenv("GITHUB_STEP_SUMMARY") ?: "php://stdout",
              sprintf("### Backend coverage\n\n**%s%%** — %d of %d statements\n", $pct, $c, $s), FILE_APPEND);
          '

  database:
    name: Database (PostgreSQL migrations + seed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rafeeq
          POSTGRES_USER: rafeeq
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rafeeq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate + seed on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rafeeq
          DB_USERNAME: rafeeq
          DB_PASSWORD: secret
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `ci` (not `install`) so the tree is exactly the committed lockfile.
      # Using `install` previously allowed a second nested @types/react to be
      # resolved, which broke the admin typecheck on main.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck shared packages + apps
        run: |
          npm run typecheck --workspace=packages/shared
          npm run typecheck --workspace=student-app
          npm run typecheck --workspace=driver-app
          npm run typecheck --workspace=admin-dashboard

      - name: Lint admin dashboard
        run: npm run lint --workspace=admin-dashboard

      # A dinar is 1000 fils. `toFixed(2)` rounds and displays an amount that is not
      # the stored one — 1999 fils became "2.00" on the pages where prices are SET.
      # And a hand-written "د.أ" has no bidi isolation, so it can reorder against
      # the number. Both are now unrepresentable outside @rafeeq/shared.
      - name: Money formatting gate
        run: npm run check:money

      - name: Shared package tests
        run: npm run test --workspace=packages/shared
