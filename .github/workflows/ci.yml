name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite runs against Postgres, not SQLite. SQLite silently ignores
    # SELECT ... FOR UPDATE, which made every lockForUpdate untestable and let
    # three concurrency bugs through a green suite.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rafeeq_test
          POSTGRES_USER: rafeeq
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pgsql, pdo_pgsql, sqlite3, pdo_sqlite, redis
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (php -l) all source files
        run: |
          find Core Shared Infrastructure Modules database config bootstrap -name "*.php" -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Static analysis (PHPStan / Larastan, level 5 + baseline)
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Boot smoke test (registers every module + route)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan route:list > /dev/null
          php artisan config:clear

      - name: Migrate against Postgres
        env: &pg
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rafeeq_test
          DB_USERNAME: rafeeq
          DB_PASSWORD: secret
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force

      - name: Run PHPUnit tests (Postgres + coverage)
        env: *pg
        run: php -d memory_limit=1G vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          php -r '
            $f = "coverage.xml";
            if (! is_file($f)) { echo "no coverage file\n"; exit(0); }
            $x = simplexml_load_file($f);
            $m = $x->project->metrics;
            $s = (int) $m["statements"]; $c = (int) $m["coveredstatements"];
            $pct = $s ? round($c / $s * 100, 2) : 0;
            printf("lines %d/%d = %s%%\n", $c, $s, $pct);
            file_put_contents(getenv("GITHUB_STEP_SUMMARY") ?: "php://stdout",
              sprintf("### Backend coverage\n\n**%s%%** — %d of %d statements\n", $pct, $c, $s), FILE_APPEND);
          '

  database:
    name: Database (PostgreSQL migrations + seed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rafeeq
          POSTGRES_USER: rafeeq
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rafeeq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # `AdminUserSeeder` carried a working password and a personal email address as
      # `env()` DEFAULTS, in a public repository. The fix is that it now THROWS when
      # they are unset — which is only a fix if something keeps checking that it
      # throws. An `env()` default is trivial to reintroduce and completely silent, so
      # the guard is asserted here before the seed that depends on it.
      - name: The admin seeder must refuse to run without credentials
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rafeeq
          DB_USERNAME: rafeeq
          DB_PASSWORD: secret
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan migrate:fresh --force
          if php artisan db:seed --force > seed.log 2>&1; then
            echo "::error::db:seed succeeded with no SEED_ADMIN_* set — the admin seeder has a default credential again."
            cat seed.log
            exit 1
          fi
          grep -q 'SEED_ADMIN_EMAIL is not set' seed.log || {
            echo "::error::db:seed failed, but not on the missing-credential guard:"; cat seed.log; exit 1;
          }

      - name: Migrate + seed on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rafeeq
          DB_USERNAME: rafeeq
          DB_PASSWORD: secret
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          # CI-only values. Not a secret being published: it is a throwaway database
          # that is destroyed with the runner, and the point is to exercise the seed
          # path, not to hold an account anyone can reach.
          SEED_ADMIN_EMAIL: ci-admin@rafeeq.invalid
          SEED_ADMIN_PHONE: '+962790000000'
          SEED_ADMIN_NAME: CI Admin
          SEED_ADMIN_PASSWORD: ${{ github.sha }}
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `ci` (not `install`) so the tree is exactly the committed lockfile.
      # Using `install` previously allowed a second nested @types/react to be
      # resolved, which broke the admin typecheck on main.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck every workspace
        run: npm run typecheck

      # Two configs: `next/core-web-vitals` for the dashboard, and a deliberately
      # small one at the frontend root for the Expo apps and the shared packages.
      #
      # The root config did not exist before phase 7 — `npm run lint` there was
      # `eslint . --ext .ts,.tsx` with nothing above it, so it exited with
      # "couldn't find a configuration file". A script that had never run.
      #
      # `react-hooks/rules-of-hooks` found a real bug on its first execution:
      # `LiveMap` called three hooks AFTER an early `return` for the web branch. It
      # never crashed, because `Platform.OS` is constant per process, which is
      # exactly why it survived review.
      - name: Lint
        run: npm run lint

      # ── Design gates ──────────────────────────────────────────────────────
      #
      # `check:tokens` regenerates docs/design/src/kit.css and the admin Tailwind
      # config from packages/tokens and fails on any difference. Before this, the
      # brand hexes existed in FOUR hand-maintained copies and three of them had
      # drifted — including a retired navy/teal palette still rendering on both
      # apps' splash screens. Nothing compared them, so nothing caught it.
      #
      # `check:icons` resolves every icon name against the INSTALLED Lucide and
      # fails on one it does not export. Lucide renames glyphs between versions
      # (`home` → `house`, `history` → `rotate-ccw-clock`) and an unresolved name
      # renders nothing — a gap the right size, so the layout still looks
      # deliberate and the missing icon survives review.
      #
      # `check:design` is a set of RATCHETS, not zeroes. Two gates are hard zeros
      # (the retired palette, the fictional `extrabold` weight); the rest hold a
      # budget that may only decrease, because phases 8–9 rewrite the screens that
      # still carry raw font sizes. A gate asserted at zero before it is zero gets
      # commented out by the next person in a hurry.
      #
      # `check:money` — a dinar is 1000 fils. `toFixed(2)` rounds and displays an
      # amount that is not the stored one; 1999 fils became "2.00" on the pages
      # where prices are SET. And a hand-written "د.أ" has no bidi isolation, so it
      # can reorder against its number. Both are unrepresentable outside
      # @rafeeq/shared now, and this gate keeps them that way.
      #
      # `check:invariants` holds five HARD ZEROS that phase 7 established, and the
      # difference from the budgets above is deliberate: these are at zero today, so
      # asserting zero costs nothing and the first regression is caught by whoever
      # causes it.
      #
      #   unlabelled-icon-button  28 pressables had an icon as their only child and
      #                           no accessibilityLabel. That word appeared ZERO
      #                           times in either app; the product was unusable
      #                           without sight.
      #   th-without-scope        156 admin table headers had no scope, so a
      #                           9-column payouts table read as 9 unlabelled
      #                           numbers per row.
      #   layer-violation         admin-dashboard must never reach @rafeeq/ui or
      #                           react-native, and packages must never import an
      #                           app — that direction is what forced the two src/
      #                           trees to be copies.
      #   empty-without-error     seven screens rendered "there is nothing here"
      #                           when the request had FAILED, including the wallet
      #                           ledger and the emergency-contacts list.
      #   duplicated-app-file     nine files were byte-identical across the two
      #                           apps, 1,128 lines including a 510-line LiveMap.
      - name: Design and structural gates
        run: npm run check

      - name: Frontend tests
        run: npm run test

      # A typecheck does NOT catch a bundler failure. Re-exporting the generated
      # Lucide registry from the @rafeeq/tokens barrel typechecked cleanly on all
      # six workspaces and still broke `next build`, because it dragged
      # `react-native` into the dashboard bundle and webpack hit Flow syntax inside
      # `react-native/index.js`. Only a real build finds that class of defect.
      - name: Build admin dashboard
        run: npm run build --workspace=admin-dashboard

      # The step above states the principle — only a real build finds a bundler
      # failure — and then applied it to one of the three front-ends. The two apps had
      # no build step at all, and that gap was not hypothetical.
      #
      # Phase 7 consolidated the logo into `packages/ui/assets/r-logo.png` and DELETED
      # `student-app/assets/r-logo.png` and `driver-app/assets/r-logo.png`, but left
      # both `welcome.tsx` files calling `require('../../assets/r-logo.png')`:
      #
      #     Unable to resolve module ../../assets/r-logo.png
      #
      # `welcome` is the entry of the auth flow, so NEITHER APP COULD BUNDLE AT ALL —
      # and it sat on main through phases 8 and 9 with CI green, because `tsc` does not
      # verify the path inside a `require()` of an image and nothing here ever asked
      # Metro to resolve one. A web export is the cheapest way to make it ask: it walks
      # the same module graph and the same asset registry as an EAS build.
      - name: Bundle the Expo apps (Metro resolves every import and asset)
        env:
          # Bundling never executes app code, so this is only here to keep
          # `resolveApiBaseUrl` honest about what a release build is handed: an https
          # URL. It refuses plain http in a release bundle on purpose.
          EXPO_PUBLIC_API_URL: https://api.rafeeq.invalid
        run: |
          for app in student-app driver-app; do
            echo "::group::bundling $app"
            (cd "$app" && npx expo export -p web --output-dir "$RUNNER_TEMP/export-$app")
            echo "::endgroup::"
          done
